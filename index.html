<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedimentos Operacionais</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 680px;
    }
    h1 {
      color: #f0f6fc;
      font-size: 22px;
      margin-bottom: 24px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    details {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    summary {
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: "›";
      font-size: 20px;
      transition: transform 0.2s;
    }
    details[open] summary::after {
      transform: rotate(90deg);
    }
    .doc-list {
      padding: 10px 18px 16px 18px;
      border-top: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .doc-link {
      color: #e6edf3;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0d1117;
      border: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .doc-link:hover {
      border-color: #58a6ff;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>Base de Procedimentos</h1>

  <!-- Categoria Hyper-V -->
  <details open>
    <summary>🖥️ Hyper-V</summary>
    <div class="doc-list">
      <a class="doc-link" href="hyper-v/manutencao-armazenamento.html">
        <span>Manutenção e Otimização de Armazenamento</span>
        <span style="color: #8b949e; font-size: 12px;">VHDX / Trim</span>
      </a>
      <a class="doc-link" href="hyper-v/exportar-importar.html">
        <span>Exportar e Importar Máquinas Virtuais</span>
        <span style="color: #8b949e; font-size: 12px;">Backup</span>
      </a>
    </div>
  </details>

  <!-- Próximas categorias futuras -->
  <details>
    <summary>⚙️ Redes e Conectividade</summary>
    <div class="doc-list">
      <a class="doc-link" href="#">
        <span>Configuração de vSwitch e Bridge</span>
      </a>
    </div>
  </details>
</div>

</body>
</html>
